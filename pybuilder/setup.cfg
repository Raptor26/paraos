[flake8]
max-returns = 5
min-name-length = 3
max-local-variables = 10
max-module-members = 10
max-line-length = 79
exclude =
    # Legacy code
    builder_functions.py
    # No need to traverse our git directory
    .git,
    # There's no value in checking cache directories
    __pycache__,
    # No need to check other libraries in the venv directory
    venv,
    # No need to check non Python directories
    cpp,
    .vscode
per-file-ignores =
    # Test contains CMakePresets.json example, which contains multiple
    # string repetitions
    test_pycmakebuilder.py: WPS226,
    # Found overused expression: self.cmake_presets_json['configurePresets']
    WPS204
    # Module contains many helper functions
    pycmakebuilder.py: WPS202
    # Found wrong function call: print - why print has been banned?
    builder_functions.py: WPS421,
    # Found explicit string concatenation.
    WPS336
# Count errors number and print it in the end.
count = True
