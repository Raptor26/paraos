stages:
 - test_windows
 - test_windows_freertos
 - test_windows_stress
 - test_windows_stress_freertos
 - test_linux
 - test_linux_valgrind
 - test_linux_freertos
 - test_linux_stress
 - test_linux_stress_freertos
 
## windows ---------------------------------------------------------------------
ci:windows:
 stage: test_windows
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\\venv\\Scripts\\python pybuilder\\pycmakebuilder.py 
    -d="$PWD" 
    --ctest-options="--output-on-failure 
                     --stop-on-failure 
                     --schedule-random
                     --timeout 20"
    -e="freertos*"
    -b="trace*|release*"
 rules:
    # If merge request only no need start pipeline because pipeline was started when branch pushed in repo   
  - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
    when: always
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
    allow_failure: false
    # When a push is made on a branch, we always want to start the pipeline
  - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    when: always
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: always
    allow_failure: false
  - if: $CI_COMMIT_BRANCH == 'master'
    when: always
    allow_failure: false
  - when: never

