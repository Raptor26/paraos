stages:
 - test_windows
 - test_linux
 - test_windows_stress_gcc
 - test_windows_stress_clang
 - test_linux_stress_gcc
 - test_linux_stress_clang

## windows ---------------------------------------------------------------------
ci:windows:
 stage: test_windows
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\venv\Scripts\activate
  - cd pybuilder
  - pip install -r builder_requirements.txt
  - cd ..
  - deactivate
  - .\venv\Scripts\python -m builder -a 1

ci:windows_stress_gcc:
 stage: test_windows_stress_gcc
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\venv\Scripts\activate
  - cd pybuilder
  - pip install -r builder_requirements.txt
  - cd ..
  - deactivate
  - .\venv\Scripts\python -m builder -a 5
 rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
    allow_failure: false
  - if: $CI_COMMIT_BRANCH == 'master'
    when: always
    allow_failure: false

ci:windows_stress_clang:
 stage: test_windows_stress_clang
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\venv\Scripts\activate
  - cd pybuilder
  - pip install -r builder_requirements.txt
  - cd ..
  - deactivate
  - .\venv\Scripts\python -m builder -a 6
 rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
    allow_failure: false
  - if: $CI_COMMIT_BRANCH == 'master'
    when: always
    allow_failure: false

## Linux -----------------------------------------------------------------------
ci:linux:
 stage: test_linux
 needs: []
 tags:
  - linux
 script:
  - python3 -m venv venv
  - source ./venv/bin/activate
  - cd pybuilder
  - pip install -r builder_requirements.txt
  - cd ..
  - deactivate
  - venv/bin/python3 -m builder -a 1
  
