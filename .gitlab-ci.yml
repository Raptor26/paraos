ci:windows_stress_gcc:
 stage: test_windows_stress
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\\venv\\Scripts\\python pybuilder\\pycmakebuilder.py
    -d="$PWD" 
    --ctest-options="--output-on-failure 
                     --stop-on-failure 
                     -j12 
                     --repeat-until-fail 120
                     --timeout 30
                     -L [stress]" 
    -i="" 
    -e="pc_debug_clang_trace|
        freertos_debug_clang_trace|
        pc_debug_clang_docker|
        pc_debug_gcc_clang_tidy|
        freertos_debug_gcc_clang_tidy"
 rules:
  - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
    when: never
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: always
    allow_failure: false
  - if: $CI_COMMIT_BRANCH == 'master'
    when: always
    allow_failure: false


