stages:
 - test_windows
 - test_linux
 - test_windows_stress
 - test_linux_stress
 
## windows ---------------------------------------------------------------------
ci:windows:
 stage: test_windows
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\\venv\\Scripts\\python pybuilder\\pycmakebuilder.py 
    -d="$PWD" 
    --ctest-options="--output-on-failure 
                     --stop-on-failure 
                     -j12" 
    -e="pc_debug_clang_docker"

ci:windows_stress_gcc:
 stage: test_windows_stress
 needs: []
 tags:
  - windows
 script:
  - python -m venv venv
  - .\\venv\\Scripts\\python pybuilder\\pycmakebuilder.py
    -d="$PWD" 
    --ctest-options="--output-on-failure 
                     --stop-on-failure 
                     -j12 
                     --repeat-until-fail 200" 
    -e="pc_debug_clang_trace 
        freertos_debug_clang_trace 
        pc_debug_clang_docker"
 rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: always
    allow_failure: false
  - if: $CI_COMMIT_BRANCH == 'master'
    when: always
    allow_failure: false


## Linux -----------------------------------------------------------------------
ci:linux:
 stage: test_linux
 needs: []
 tags:
  - linux
 script:
  - python3 -m venv venv
  - venv/bin/python3 pybuilder/pycmakebuilder.py 
    -d="${PWD}" 
    --ctest-options="--output-on-failure 
                     --stop-on-failure 
                     -j8" 
    -e="pc_debug_clang_docker"

