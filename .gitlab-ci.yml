## Linux -----------------------------------------------------------------------
ci:linux_posix_debug_clang:
 stage: test_linux_posix_debug_clang
 needs: []
 tags:
  - linux
 script:
  - cmake --preset pc_debug_clang
  - cmake --build build/pc_debug_clang
  - ctest --test-dir build/pc_debug_clang --timeout 15 --stop-on-failure --schedule-random

ci:linux_posix_debug_clang_stress:
 stage: test_linux_posix_debug_clang_stress
 needs: []
 tags:
  - linux
 script:
  - cmake --preset pc_debug_clang
  - cmake --build build/pc_debug_clang
  - ctest --test-dir build/pc_debug_clang --timeout 15 --stop-on-failure --repeat-until-fail 500 --schedule-random -j4
 rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
    allow_failure: true
    if: $CI_COMMIT_BRANCH == 'master'
    when: always
    allow_failure: true
    if: $CI_COMMIT_BRANCH == 'develop'
    when: always
    allow_failure: true

